services:
  - type: web
    name: reclaim-ai
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    workingDirectory: /backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.15